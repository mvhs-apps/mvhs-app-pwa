<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVHS Interactive Campus Map</title>
<style>
  :root{
    --gold: #FFC000;
    --gold-dark: #C99400;
    --ink: #1a1a1a;
    --paper: #ffffff;
    --highlight-fill: rgba(255,192,0,0.28);
    --highlight-stroke: #C99400;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f7f5;
    color: var(--ink);
    padding: 24px 16px 48px;
  }

  .page-title{
    max-width: 1100px;
    margin: 0 auto 4px;
  }
  .page-title h1{
    font-size: clamp(20px, 3vw, 28px);
    margin: 0 0 2px;
  }
  .page-title p{
    margin: 0 0 18px;
    color: #555;
    font-size: 14px;
  }

  .map-wrap{
    position: relative;
    max-width: 1100px;
    margin: 0 auto;
    background: var(--paper);
    border-radius: 14px;
    box-shadow: 0 2px 18px rgba(0,0,0,0.10);
    padding: 10px;
  }

  .map-svg-wrap{
    position: relative;
    width: 100%;
    line-height: 0;
  }

  .map-svg-wrap img.base-map{
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    user-select: none;
    -webkit-user-drag: none;
  }

  svg.overlay{
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }

  .hotzone{
    fill: rgba(255,192,0,0);
    stroke: transparent;
    stroke-width: 3;
    cursor: pointer;
    transition: fill 160ms ease, stroke 160ms ease, filter 160ms ease;
    pointer-events: auto;
  }

  .hotzone-group:hover .hotzone,
  .hotzone-group.active .hotzone,
  .hotzone-group:focus-visible .hotzone{
    fill: var(--highlight-fill);
    stroke: var(--highlight-stroke);
    filter: drop-shadow(0 0 6px rgba(201,148,0,0.55));
  }

  .hotzone-group{ outline: none; }

  /* pulsing flag cue */
  .cue{
    cursor: pointer;
    pointer-events: auto;
  }
  .cue-hit{
    fill: transparent;
    stroke: transparent;
    pointer-events: all;
  }
  .cue circle.glow{
    fill: none;
    stroke: var(--gold);
    stroke-width: 5;
    opacity: 0.75;
    filter: drop-shadow(0 0 5px rgba(201,148,0,0.7));
    pointer-events: none;
  }
  .cue circle.pulse{
    fill: none;
    stroke: var(--gold);
    stroke-width: 5;
    opacity: 0.7;
    filter: drop-shadow(0 0 6px rgba(201,148,0,0.65));
    transform-origin: center;
    animation: pulse 2.2s ease-out infinite;
    pointer-events: none;
  }
  .hotzone-group:hover .cue circle.pulse,
  .hotzone-group.active .cue circle.pulse{
    animation-duration: 1.1s;
  }

  @keyframes pulse{
    0%   { r: 12px; opacity: 0.7; }
    70%  { r: 34px; opacity: 0; }
    100% { r: 34px; opacity: 0; }
  }

  .legend-hint{
    max-width: 1100px;
    margin: 12px auto 0;
    font-size: 13px;
    color: #666;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .legend-hint .swatch{
    display:inline-block;
    width: 14px; height: 14px;
    border-radius: 3px;
    background: var(--highlight-fill);
    border: 2px solid var(--highlight-stroke);
    flex: none;
  }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(20,18,10,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    backdrop-filter: blur(2px);
  }
  .modal-backdrop.open{ display: flex; }

  .modal{
    background: #fff;
    border-radius: 16px;
    max-width: 560px;
    width: 100%;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    animation: modal-in 180ms ease-out;
  }
  @keyframes modal-in{
    from{ opacity: 0; transform: translateY(10px) scale(0.98); }
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    gap: 12px;
  }
  .modal-header h2{
    margin: 0;
    font-size: 18px;
  }
  .modal-close{
    background: #f2f2f0;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    color: #444;
    flex: none;
    transition: background 120ms ease;
  }
  .modal-close:hover{ background: #e6e6e2; }

  .floor-toggle{
    display: flex;
    gap: 6px;
    padding: 14px 20px 0;
  }
  .floor-btn{
    flex: 1;
    padding: 9px 14px;
    border-radius: 999px;
    border: 1.5px solid #ddd;
    background: #fafafa;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #555;
    transition: all 140ms ease;
  }
  .floor-btn:hover{
    border-color: var(--gold-dark);
  }
  .floor-btn.active{
    background: var(--gold);
    border-color: var(--gold-dark);
    color: #322400;
  }

  .modal-body{
    padding: 16px 20px 22px;
    overflow: auto;
  }
  .floor-image-wrap{
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fbfaf7;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 10px;
    min-height: 200px;
  }
  .floor-image-wrap img{
    max-width: 100%;
    max-height: 60vh;
    height: auto;
    display: block;
  }

  .modal-footnote{
    margin-top: 10px;
    font-size: 12.5px;
    color: #888;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce){
    .cue circle.pulse{ animation: none; opacity: 0.35; }
    .modal{ animation: none; }
  }
</style>
</head>
<body>

<div class="page-title">

  <p>Click the Student Services Building or the 700s Wing to view floor 1 &amp; floor 2 layouts.</p>

  };

  const backdrop = document.getElementById('modalBackdrop');
  const modalTitle = document.getElementById('modalTitle');
  const floorImage = document.getElementById('floorImage');
  const btnFloor1 = document.getElementById('btnFloor1');
  const btnFloor2 = document.getElementById('btnFloor2');
  const modalClose = document.getElementById('modalClose');

  let currentBuilding = null;

  function setFloor(floorNum){
    if(!currentBuilding) return;
    const b = buildings[currentBuilding];
    floorImage.src = floorNum === 1 ? b.floor1 : b.floor2;
    floorImage.alt = b.name + " — Floor " + floorNum;
    btnFloor1.classList.toggle('active', floorNum === 1);
    btnFloor2.classList.toggle('active', floorNum === 2);
  }

  function openModal(targetKey, triggerEl){
    const b = buildings[targetKey];
    if(!b) return;
    currentBuilding = targetKey;
    modalTitle.textContent = b.name;
    setFloor(1);
    backdrop.classList.add('open');
    modalClose.focus();
    document.querySelectorAll('.hotzone-group').forEach(g => g.classList.remove('active'));
    if(triggerEl) triggerEl.classList.add('active');
  }

  function closeModal(){
    backdrop.classList.remove('open');
    document.querySelectorAll('.hotzone-group').forEach(g => g.classList.remove('active'));
    currentBuilding = null;
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  document.querySelectorAll('.hotzone-group').forEach(group => {
    const key = group.getAttribute('data-target');
    group.addEventListener('click', () => openModal(key, group));
    group.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        openModal(key, group);
      }
    });
  });

  btnFloor1.addEventListener('click', () => setFloor(1));
  btnFloor2.addEventListener('click', () => setFloor(2));
  modalClose.addEventListener('click', closeModal);
  backdrop.addEventListener('click', (e) => {
    if(e.target === backdrop) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && backdrop.classList.contains('open')) closeModal();
  });
</script>
